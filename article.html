<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --page-bg: #f2f4f7;
    --surface: #ffffff;
    --surface-strong: #eef1f5;
    --border: #e6e9ee;
    --text: #12151b;
    --text-secondary: #6b7280;
    --text-faint: #9aa1ac;
    --accent: #2c5ce0;
    --accent-strong: #1c3fa8;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-display: 'Noto Sans JP', sans-serif;
    --font-mono: 'Roboto Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page-bg); color: var(--text); font-family: var(--font-display); font-size: 14px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  .site-header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top:0; z-index: 20; }
  .header-inner { max-width: 760px; margin: 0 auto; padding: 12px 20px; display:flex; align-items:center; gap: 20px; }
  .logo img { height: 40px; }
  .back-link { margin-left:auto; font-size: 13px; font-weight: 500; color: var(--accent); }
  .back-link:hover { color: var(--accent-strong); }

  .page { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  .article-panel { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; }

  .tag-row { display:flex; gap:8px; margin-bottom: 14px; }
  .tag { font-size: 11.5px; font-weight:700; padding:3px 9px; border-radius:5px; color:#fff; white-space:nowrap; }
  .tag.tag-cat { background: var(--surface-strong); color: var(--text-secondary); }
  .tag.tag-pinned { background: #fdf0d5; color: #a3690a; font-weight: 700; }

  .empty-state { text-align:center; padding: 60px 20px; color: var(--text-faint); font-size: 13px; }

  .article-title { font-size: 22px; font-weight: 900; line-height:1.5; margin: 0 0 10px; }
  .article-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); display:block; margin-bottom: 20px; }
  .article-body { font-size: 15px; color: var(--text); margin: 0 0 26px; white-space: pre-wrap; }
  .article-body a { color: var(--accent); font-weight: 500; }
  .article-body a:hover { color: var(--accent-strong); }

  .source-block { border-top: 1px solid var(--border); padding-top: 20px; }
  .source-label { font-size: 12px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .source-fallback-link {
    display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 500;
  }
  .no-source { font-size: 13px; color: var(--text-faint); }

  .gacha-period-row { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline; margin: 0 0 22px; padding: 12px 14px; background: var(--surface-strong); border-radius: var(--radius-md); }
  .gacha-period-range { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
  .gacha-period-remain { font-family: var(--font-mono); font-size: 13.5px; font-weight:700; color: var(--text-secondary); }
  .gacha-urgent .gacha-period-remain { color: #e23d3d; }

  .gacha-items-block { margin: 0 0 22px; }
  .gacha-items-block-title { font-size: 13px; font-weight:700; color: var(--text-secondary); margin: 0 0 8px; }
  .gacha-items-table { width:100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  .gacha-items-table th, .gacha-items-table td { text-align:left; padding: 8px 10px; border-bottom: 1px solid var(--border); overflow-wrap: break-word; }
  /* 列幅を固定することで、表ごとに中身の長さが違っても、どの表でも同じ位置で列が揃うようにする */
  .gacha-items-table th:nth-child(1), .gacha-items-table td:nth-child(1) { width: 46%; }
  .gacha-items-table th:nth-child(2), .gacha-items-table td:nth-child(2) { width: 22%; }
  .gacha-items-table th:nth-child(3), .gacha-items-table td:nth-child(3) { width: 32%; }
  .gacha-items-table th { color: var(--text-faint); font-weight:500; font-size: 12px; }
  .gacha-items-table tr.gacha-highlight-row { background: #fdf3d9; }
  .gacha-items-table tr.gacha-highlight-row td { font-weight:700; color: #8a5a00; }
  .gacha-items-table tr.gacha-highlight-row td:first-child::before { content: '★ '; color: #d6a017; }

  /* 1つの記事に複数のガチャがある場合、ガチャ(バナー)ごとにグループとしてまとめて表示する */
  .gacha-banner-group { margin: 0 0 28px; }
  .gacha-banner-group:last-child { margin-bottom: 0; }
  .gacha-banner-title {
    font-size: 15px; font-weight: 900; color: var(--text);
    margin: 0 0 14px; padding-left: 10px; border-left: 4px solid var(--accent);
  }

  /* コード一覧の表 */
  .code-items-block { margin: 0 0 22px; }
  .code-items-table { width:100%; border-collapse: collapse; font-size: 13px; }
  .code-items-table th, .code-items-table td { text-align:left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .code-items-table th { color: var(--text-faint); font-weight:500; font-size: 12px; }
  .code-copy-btn {
    font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text);
    background: var(--surface-strong); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 5px 10px; cursor: pointer;
  }
  .code-copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .code-copy-btn.copied { border-color: #1fae7a; color: #1fae7a; }
  .code-redeem-btn {
    display: inline-block; font-size: 12.5px; font-weight: 500; color: var(--accent);
    padding: 5px 10px; border: 1px solid var(--accent); border-radius: var(--radius-sm);
  }
  .code-redeem-btn:hover { background: var(--accent); color: #fff; }

  /* 配信アーカイブの埋め込み(16:9比率を保ったまま、横幅いっぱいに表示する) */
  .archive-embed-block { margin: 0 0 22px; }
  .archive-embed-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--radius-md); overflow: hidden; background: #000; }
  .archive-embed-wrap iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }

  .not-found { text-align:center; padding: 60px 20px; color: var(--text-faint); }
  .not-found a { color: var(--accent); font-weight:500; }

  .site-footer { border-top: 1px solid var(--border); margin-top: 24px; }
  .footer-inner {
    max-width: 760px; margin: 0 auto; padding: 18px 20px 40px;
    font-size: 12px; color: var(--text-faint); display: flex; gap: 14px; flex-wrap: wrap;
  }
  .footer-inner a { color: var(--accent); font-weight: 500; }
  .footer-inner a:hover { color: var(--accent-strong); }

  /* ---------- アフィリエイト表示 ---------- */
  .affiliate-block { border-top: 1px solid var(--border); padding-top: 18px; margin-top: 22px; }
  .affiliate-heading {
    font-size: 12px; font-weight: 700; color: var(--text-faint);
    display: flex; align-items: center; gap: 6px; margin: 0 0 8px;
  }
  .affiliate-pr-mark {
    font-size: 10px; font-weight: 700; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px;
  }
  .affiliate-article-link a { font-size: 13px; color: var(--accent); font-weight: 500; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html"><img src="assets/logo.svg" alt="AstralHub"></a>
    <a class="back-link" href="index.html">← トップに戻る</a>
  </div>
</header>

<div class="page" id="page"></div>

<footer class="site-footer">
  <div class="footer-inner">
    <span>&copy; 2026 AstralHub</span>
    <a href="contact.html">管理人への問い合わせ</a>
    <a href="privacy.html">プライバシーポリシー</a>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/site-data.js"></script>
<script>
const { CATEGORY_LABEL } = window.ASTRA_CONFIG;
const { gameById, timeAgoLabel, findNewsById, loadingHtml, refreshNewsData, gachaPeriodHtml, gachaItemsTableHtml, codeItemsTableHtml, streamArchiveEmbedHtml, affiliateArticleLinkHtml } = window.ASTRA_DATA;

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const pageEl = document.getElementById('page');
pageEl.innerHTML = loadingHtml();

(async function init(){
  await refreshNewsData();
  const item = id ? findNewsById(id) : null;

  if (!item) {
    pageEl.innerHTML = `<div class="not-found">
      記事が見つかりませんでした。削除されたか、URLが正しくない可能性があります。<br>
      <a href="index.html">トップページに戻る</a>
    </div>`;
    return;
  }

  const g = gameById(item.game);
  document.title = `${item.title} | AstralHub`;

  let sourceHtml = '<p class="no-source">この記事には元投稿のリンクが登録されていません。</p>';
  if (item.url) {
    sourceHtml = `
      <blockquote class="twitter-tweet"><a href="${item.url}"></a></blockquote>
      <a class="source-fallback-link" href="${item.url}" target="_blank" rel="noopener">元の投稿をXで見る ↗</a>
    `;
  }

  pageEl.innerHTML = `
    <div class="article-panel">
      <div class="tag-row">
        ${item.pinned === 'pinned' ? '<span class="tag tag-pinned">📌 固定</span>' : ''}
        <span class="tag" style="background:${g.color}">${g.name}</span>
        ${item.cat ? `<span class="tag tag-cat">${CATEGORY_LABEL[item.cat] || item.cat}</span>` : ''}
      </div>
      <h1 class="article-title">${item.title}</h1>
      <span class="article-time">${timeAgoLabel(item.publishedAt)}・${new Date(item.publishedAt).toLocaleString('ja-JP')}</span>
      ${item.cat === 'gacha' ? gachaPeriodHtml(item) : ''}
      ${item.cat === 'gacha' ? gachaItemsTableHtml(item.gachaItems) : ''}
      ${item.cat === 'code' ? codeItemsTableHtml(item.codeItems) : ''}
      ${item.cat === 'stream' ? streamArchiveEmbedHtml(item.archiveUrl) : ''}
      ${item.summary ? `<p class="article-body">${item.summary}</p>` : ''}
      ${affiliateArticleLinkHtml()}
      <div class="source-block">
        <div class="source-label">Source</div>
        ${sourceHtml}
      </div>
    </div>
  `;

  // 「コード」欄のコピー ボタン:押すとコードをクリップボードにコピーし、一時的に「コピー済み」の見た目にする
  pageEl.querySelectorAll('.code-copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const code = btn.dataset.code || '';
      try {
        await navigator.clipboard.writeText(code);
      } catch (e) {
        // クリップボードAPIが使えない環境向けの保険(古いブラウザなど)
        const textarea = document.createElement('textarea');
        textarea.value = code;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
      const original = btn.textContent;
      btn.textContent = 'コピーしました';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
    });
  });

  // X投稿の埋め込みウィジェットを読み込む（元URLが登録されている場合のみ）
  if (item.url) {
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://platform.twitter.com/widgets.js';
    script.charset = 'utf-8';
    document.body.appendChild(script);
  }
})();

</script>
</body>
</html>
